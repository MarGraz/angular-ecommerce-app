<div class="container">
    <h2>Our collection</h2>

    <div fxLayout="row wrap" fxLayoutGap="50px grid">
        <div *ngFor="let product of products">
            <mat-card class="product-card" appearance="outlined">
                <img mat-card-image src="assets/images/{{product.image_url}}" alt="Product photo">
                <mat-card-content>
                    <mat-card-title style="color: white;">{{product.name}}</mat-card-title>
                    <mat-card-subtitle>{{product.price | currency:'EUR'}} </mat-card-subtitle>
                </mat-card-content>
            </mat-card>
        </div>
        </div>        
</div>
